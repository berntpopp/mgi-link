name: Container CI

on:
  pull_request:
    paths:
      - mgi_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml
  push:
    branches:
      - main
    paths:
      - mgi_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml

concurrency:
  group: container-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-ci:
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@6568a0ad7d68925440aba550a2a678282ea5bb6b # genefoundry-router v0.8.7
